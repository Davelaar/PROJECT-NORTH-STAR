services:
  api:
    build:
      context: .
      target: api
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8787"
      WEB_ORIGIN: "${WEB_ORIGIN:-https://openfilament.nl}"
      DATABASE_URL: "file:/data/open-filament.sqlite"
      SESSION_SECRET: "${SESSION_SECRET:-change-me-in-production-please-32c}"
      AMAZON_AFFILIATE_TAG: "${AMAZON_AFFILIATE_TAG:-3dapeldoorn-21}"
    volumes:
      - of-data:/data
    expose:
      - "8787"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    environment:
      API_INTERNAL_URL: "http://api:8787"
      API_REWRITE_TARGET: "http://api:8787"
      # Same-origin in the browser via Next rewrites
      NEXT_PUBLIC_API_URL: ""
    depends_on:
      - api
    # When using the proxy profile, bind web only on loopback (Caddy is public).
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    restart: unless-stopped

  # Production entry: docker compose --profile proxy up -d --build
  caddy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: "${ACME_EMAIL:-admin@openfilament.nl}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  of-data:
  caddy-data:
  caddy-config:
